name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs a GOOGLE_API_KEY. LLM tests replay recorded cassettes and
# the suite never calls the network; a cassette miss fails loudly instead.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      # The Docker sandbox tests skip themselves here; the docker job runs them.
      - run: python -m pytest

  docker-sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: docker build -f runner.Dockerfile -t autonexus-runner:latest .
      # With the image present, the live container tests run for real:
      # no network, read-only inputs, timeout kill, and the recorded Gemini
      # pipelines executed inside the container.
      - run: python -m pytest tests/test_execution.py -rs

  # Builds the production images exactly as docker compose would and checks
  # the stack comes up healthy through nginx. A production install has no dev
  # extras, so this is the only job that would catch a runtime dependency
  # that only ever arrived through the dev install - which happened (httpx).
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Health and SPA routing through nginx
        run: |
          curl -fsS http://localhost:8080/api/health
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS -o /dev/null http://localhost:8080/pipeline
      - name: Upload and profile through the proxy
        run: |
          printf 'id,amount,plan,churn\n' > /tmp/smoke.csv
          for i in $(seq 1 60); do echo "$i,$((i*3)),$([ $((i%3)) = 0 ] && echo gold || echo basic),$([ $((i%4)) = 0 ] && echo yes || echo no)" >> /tmp/smoke.csv; done
          id=$(curl -fsS -F "file=@/tmp/smoke.csv" http://localhost:8080/api/datasets | python3 -c 'import sys,json; print(json.load(sys.stdin)["dataset_id"])')
          curl -fsS -H 'Content-Type: application/json' -d '{"target_column":"churn"}' "http://localhost:8080/api/datasets/$id/profile" > /dev/null
          curl -fsS "http://localhost:8080/api/datasets/$id/distributions" > /dev/null
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
