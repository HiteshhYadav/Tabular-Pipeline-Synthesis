name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs a GOOGLE_API_KEY. LLM tests replay recorded cassettes and
# the suite never calls the network; a cassette miss fails loudly instead.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      # The Docker sandbox tests skip themselves here; the docker job runs them.
      - run: python -m pytest

  docker-sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: docker build -f runner.Dockerfile -t autonexus-runner:latest .
      # With the image present, the live container tests run for real:
      # no network, read-only inputs, timeout kill, and the recorded Gemini
      # pipelines executed inside the container.
      - run: python -m pytest tests/test_execution.py -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
