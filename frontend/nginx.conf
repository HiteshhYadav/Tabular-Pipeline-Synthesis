# Serves the built SPA and proxies /api to the API container.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads are capped at MAX_FILE_MB (50) by the API while streaming. A
    # little headroom here so the API, not nginx, produces the error - the
    # API's FILE_TOO_LARGE envelope is the one the frontend knows how to show.
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API trusts this header for per-client
        # rate limits, so a client-supplied value must not survive.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A generation can take a minute, plus one repair round; a run is
        # capped at EXECUTION_TIMEOUT_S (60). 180s covers both with margin.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering off;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Client-side routes (/upload, /profile, /pipeline...) all serve the app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
